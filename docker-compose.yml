version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm_dev_password
      POSTGRES_DB: mm_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mm:mm_dev_password@db:5432/mm_dev
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      STORAGE_PATH: /app/storage
      DEBUG: "true"
    volumes:
      - ./storage:/app/storage
      - ./backend:/app/backend
    depends_on:
      - db
      - redis
      - ollama
    command: >
      bash -c "python scripts/create_tables.py &&
               uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  # Voice / Persona worker — runs on GPU 0
  worker-voice:
    build: .
    environment:
      DATABASE_URL: postgresql://mm:mm_dev_password@db:5432/mm_dev
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      STORAGE_PATH: /app/storage
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: celery -A workers.celery_app worker --loglevel=info -Q voice,generation,llm -n voice@%h

  # Audio / Separation worker — runs on GPU 1
  worker-audio:
    build: .
    environment:
      DATABASE_URL: postgresql://mm:mm_dev_password@db:5432/mm_dev
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
      CUDA_VISIBLE_DEVICES: "1"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    command: celery -A workers.celery_app worker --loglevel=info -Q audio,separation,alignment -n audio@%h

  # CPU worker — export, mixing, lightweight tasks
  worker-cpu:
    build: .
    environment:
      DATABASE_URL: postgresql://mm:mm_dev_password@db:5432/mm_dev
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
    command: celery -A workers.celery_app worker --loglevel=info -Q export,mixing,default -n cpu@%h

volumes:
  pgdata:
  ollama_models:
