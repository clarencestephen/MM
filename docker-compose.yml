# NOTE: This compose runs API + frontend + redis only. It uses:
#   - host Postgres (or sqlite via .env) — host port 5432
#   - host Ollama (GPU-loaded)         — host port 11434
# Workers live under the "workers" profile (CPU-only here; for real GPU runs,
# launch them on the host instead).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # sqlite stays inside the container at /app/mm_dev.db (mounted via ./)
      DATABASE_URL: sqlite:////app/mm_dev.db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      STORAGE_PATH: /app/storage
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3030,http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./mm_dev.db:/app/mm_dev.db
    depends_on:
      - redis
    command: >
      bash -c "python scripts/migrate.py &&
               uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3030:3000"
    environment:
      # Server-side rewrite target only — browsers use relative /api paths.
      # We run uvicorn on the host (so it can use the GPU); the container
      # reaches the host via host.docker.internal.
      INTERNAL_API_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
    command: sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"

  # ── Workers (opt-in: docker-compose --profile workers up) ─────────────────
  # Without nvidia-container-toolkit, these run CPU-only. For real GPU runs
  # use the host instead: celery -A workers.celery_app worker -Q ...

  worker-voice:
    profiles: ["workers"]
    build: .
    environment:
      DATABASE_URL: sqlite:////app/mm_dev.db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      STORAGE_PATH: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./mm_dev.db:/app/mm_dev.db
    depends_on:
      - redis
    command: celery -A workers.celery_app worker --loglevel=info -Q voice,generation,llm -n voice@%h

  worker-audio:
    profiles: ["workers"]
    build: .
    environment:
      DATABASE_URL: sqlite:////app/mm_dev.db
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
      - ./mm_dev.db:/app/mm_dev.db
    depends_on:
      - redis
    command: celery -A workers.celery_app worker --loglevel=info -Q audio,separation,alignment -n audio@%h

  worker-cpu:
    profiles: ["workers"]
    build: .
    environment:
      DATABASE_URL: sqlite:////app/mm_dev.db
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
      - ./mm_dev.db:/app/mm_dev.db
    depends_on:
      - redis
    command: celery -A workers.celery_app worker --loglevel=info -Q export,mixing,default -n cpu@%h
